<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Soundboard</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <header>
    <h1>Soundboard</h1>
    <button id="stop-all">Stop All</button>
  </header>

  <main id="board">
    <p class="empty-msg" id="empty-msg">No sounds found. Add <code>.mp3</code> files to the <code>sounds/</code> folder and update <code>sounds.js</code>.</p>
  </main>

  <script src="sounds.js"></script>
  <script src="app.js"></script>
</body>
</html>
